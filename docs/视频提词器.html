<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>演示视频提词器 · 非遗共创平台</title>
    <style>
      :root {
        --bg: #14100c;
        --panel: #1f1913;
        --ink: #f3ead9;
        --muted: #a89b87;
        --gold: #d6b36a;
        --red: #b23a48;
        --blue: #7fa3c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 18px;
        background: var(--panel);
        border-bottom: 1px solid #332a20;
        flex: 0 0 auto;
      }
      .brand {
        font-weight: 700;
        color: var(--gold);
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-weight: 400;
        font-size: 11px;
      }
      .clock {
        margin-left: auto;
        display: flex;
        gap: 20px;
        align-items: baseline;
        font-variant-numeric: tabular-nums;
      }
      .clock b {
        font-size: 26px;
      }
      .clock span {
        color: var(--muted);
        font-size: 12px;
      }
      .seg-time b {
        color: var(--gold);
      }
      .seg-time.over b {
        color: var(--red);
      }
      #progress {
        height: 4px;
        background: #2a231b;
        flex: 0 0 auto;
      }
      #progress > i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--gold), #e8cd92);
      }
      main {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
      #list {
        width: 250px;
        flex: 0 0 auto;
        overflow-y: auto;
        border-right: 1px solid #332a20;
        background: #191410;
        padding: 8px 0;
      }
      #list a {
        display: block;
        padding: 8px 14px;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        line-height: 1.45;
        border-left: 3px solid transparent;
        cursor: pointer;
      }
      #list a:hover {
        background: #221b15;
        color: var(--ink);
      }
      #list a.active {
        background: #2b2218;
        color: var(--gold);
        border-left-color: var(--gold);
      }
      #list a .t {
        float: right;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        color: #6d6152;
      }
      #list a.done {
        opacity: 0.5;
      }
      #stage {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 16px 34px 8px;
      }
      #seg-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex: 0 0 auto;
      }
      #seg-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--gold);
      }
      #seg-meta {
        color: var(--muted);
        font-size: 13px;
      }
      #cue {
        color: var(--blue);
        font-size: 14px;
        margin: 6px 0 10px;
        flex: 0 0 auto;
      }
      #text {
        flex: 1 1 auto;
        overflow-y: auto;
        font-size: 34px;
        line-height: 1.72;
        letter-spacing: 0.3px;
        white-space: pre-wrap;
        padding-right: 10px;
      }
      #text em {
        font-style: normal;
        color: var(--gold);
      }
      #text .num {
        color: #e8cd92;
        font-weight: 700;
      }
      footer {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 18px;
        border-top: 1px solid #332a20;
        background: var(--panel);
        font-size: 12px;
        color: var(--muted);
      }
      button {
        background: #2a231b;
        color: var(--ink);
        border: 1px solid #3d3327;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      button.primary {
        background: var(--gold);
        color: #221b12;
        border-color: var(--gold);
        font-weight: 700;
      }
      kbd {
        background: #2a231b;
        border: 1px solid #3d3327;
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 11px;
      }
      .spacer {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">演示视频提词器<small>河南省非物质文化遗产共创平台 · 平顶山学院 B 组</small></div>
      <div class="clock">
        <div class="seg-time"><span>本段</span> <b id="segClock">0:00</b></div>
        <div class="total-time"><span>全片</span> <b id="totalClock">0:00</b> <span>/ 7:14</span></div>
      </div>
    </header>
    <div id="progress"><i></i></div>
    <main>
      <nav id="list"></nav>
      <section id="stage">
        <div id="seg-head"><span id="seg-title"></span><span id="seg-meta"></span></div>
        <div id="cue"></div>
        <div id="text"></div>
      </section>
    </main>
    <footer>
      <button id="play" class="primary">开始（空格）</button>
      <button id="prev">上一段（←）</button>
      <button id="next">下一段（→）</button>
      <button id="reset">复位（R）</button>
      <span class="spacer"></span>
      <span
        ><kbd>空格</kbd> 暂停/继续 · <kbd>←</kbd><kbd>→</kbd> 切段 · <kbd>R</kbd> 复位 · <kbd>+</kbd
        ><kbd>-</kbd> 字号</span
      >
    </footer>
    <script>
      const SEGMENTS = [
        [
          '段 1　开场痛点',
          26,
          '画面：首页顶部，鼠标静止（先让评委看清品牌与标语）',
          '各位评委老师好，我们是平顶山学院 B 组，作品是河南省非物质文化遗产共创平台。\n\n我们调研了河南 41 个国家级非遗项目，发现一个矛盾：资料很厚，传承人很少，年轻人更少。\n\n所以这个平台不只做"看"，它做的是"一起做"。',
        ],
        [
          '段 2　首页全景',
          26,
          '画面：滚动轮播一次 → 鼠标划过 4 个统计数字 → 点"49 个项目"跳项目库',
          '首页。轮播是三个真实项目的实拍封面。\n\n往下是数据条：49 个项目、10 大分类、18 位传承人，每个数字都能点进去，落到对应的列表。\n\n右边是 AI 双入口：问答和共创实验室。整站 20 个页面全部同源，没有跳转断层。',
        ],
        [
          '段 3　内容底座',
          38,
          '画面：项目库 → 点钧瓷 → 滚到工艺流程 → 滚到传承人 → 点"传承人"页 → 点"数字展馆"',
          '项目库是内容底座。每个项目拆成五块：源流、工艺流程、技艺看点、代表性传承人、实拍照片。\n\n比如钧瓷，"入窑一色、出窑万彩"不是形容词，它被拆成七道工序，每一步都能对应真实操作。\n\n传承人页 18 位，带级别和代表作品；数字展馆把内容重新策展。\n\n这些内容来自 506 条语义片段，全部是公开资料，做了清洗、分段和人工校对。',
        ],
        [
          '段 4　AI 四能力总览',
          22,
          '画面：点"AI 能力"下拉 → 点"共创实验室" → 停在四个标签上',
          'AI 有四块能力，都在同一个实验室。\n\n问答解决"这工艺怎么做"，共创 Agent 解决"从哪下手"，以图搜非遗解决"这是什么"，纹样生成解决"给我一个能用的图案"。\n\n下面逐个演示。',
        ],
        [
          '段 5　RAG 问答（重点 A）',
          70,
          '画面：点"AI 问答" → 输入「钧瓷的窑变是怎么形成的？」→ 流式输出 → 滚到"检索依据" → 再问「怎么制作核武器？」看拒答',
          '先看问答。我问：钧瓷的窑变是怎么形成的。\n\n注意两点：回答是逐字流式出来的；下面一定挂着检索依据，写清用了哪几条片段。\n\n我们不用向量数据库，用 BM25 加四层加权：命中上下文乘 1.35，分类乘 1.8，项目名乘 1.5，再按热度加 1.0 到 1.18 的先验。中文没空格，所以做了 bigram 切分，让"窑变""开片"能被切出来。\n\n更关键的是这道闸门：问题里没有非遗实体，且最高分低于 10，系统直接说没找到可靠依据。\n\n我试一下：怎么制作核武器。\n它拒答了。宁可说不懂，也不生成不可靠内容。\n（停 1 秒，让画面里的拒答被看到）\n\n105 道评测题，Top-1 和 Top-3 都是 100%，平均 0.43 毫秒；没配 Key 时走规则兜底，页面照样能用。',
        ],
        [
          '段 6　共创 Agent（重点 B / 全片最重要）',
          82,
          '画面：实验室 → 共创 Agent → 输入需求 → 运行，让 5 步轨迹逐步出现，鼠标逐条指过去 → 滚到方案 → 点"一键发布"',
          '真正难的不是回答问题，是把"我想做点什么"变成"可以开工的项目"。\n\n我给它的需求是：钧瓷元素的茶杯，送给来河南旅游的年轻人，预算 50 以内。\n\n它不是一次生成，是调工具：先检索非遗，再拉项目详情，然后找关联作品，接着给任务拆分建议，最后起草项目简报。\n\n左边是它的思考，右边是工具返回的真实数据。所以方案里工艺是钧瓷真实工艺，纹样是库里真实母题，任务是四条能指派到人的任务。\n\n大模型这块有两条路：配了 Key 走大模型自主选工具，没有 Key 走规则规划器，离线同样完整。模型只负责选工具和表述，事实全部来自工具返回——这是我们控制幻觉的方式。\n\n最后点"一键发布"，这套方案直接变成共创项目，带招募要求、任务和截止时间。\n\n五个工具同时以标准 MCP 协议暴露在 /api/mcp，外部 Agent 可以直接调用。',
        ],
        [
          '段 7　端侧多模态',
          47,
          '画面：以图搜非遗 → 拖入钧瓷照片 → 指出相似度 → 切纹样生成 → 生成 → 下载 PNG',
          '多模态这块我们做了一个刻意的选择：不上传。\n\n拖一张照片进来，这张图不会发给任何服务器。浏览器里直接抽 72 维特征——48 维颜色、16 维边缘、8 维亮度——和库里的特征做距离比对。所以没有网络延迟，也没有隐私问题。\n\n另一半是纹样生成：选一个项目，取它的真实配色，用网格、团花、折枝三种传统构图程序化生成。\n\n关键是确定性随机：同一个种子永远生成同一张图，可复现、可交付。可以直接下载 PNG。',
        ],
        [
          '段 8　协作闭环',
          40,
          '画面：点"共创项目" → 划进度条与状态标签 → 点进项目看任务看板 → 点"我的工作台"',
          '共创项目页是这条链路的落点。\n\n每个项目能看到任务进度、四个阶段的状态、成员数、剩余天数。点进去是任务看板，四列：待开始、进行中、待验收、已完成，每条带负责人、进度条和截止时间。\n\n我的工作台把"我发起的、我参与的、等我审核的、等我动手的"收在一屏，数字都是从真实数据里数的。\n\n从发起、审核、分工、提交成果到结项，是一条闭环。',
        ],
        [
          '段 9　工程质量与安全',
          56,
          '画面：切终端 → npm test 结果 → npm run verify 八项全绿 → 无障碍报告一页',
          '最后说工程，因为 AI 项目最容易"能跑但不敢用"。\n\n后端 30 个单元测试全过，含 Agent 的大模型路径和失败回退；105 道检索评测题按组看指标；我们自己写了 8 项自检脚本，从资源完整性、ESLint、类型检查到接口连通，一次跑完。\n\n前端零构建 ES 模块，20 个页面同源；四个核心模块上了 JSDoc 加 TypeScript 类型检查，0 错误；无障碍做了 20 页审计；图片从 11.08MB 压到 5.56MB，少了 49.8%。\n\n安全上：输出转义、接口限流、JWT 鉴权、检索不到就拒答。',
        ],
        [
          '段 10　收尾',
          27,
          '画面：回到首页，鼠标移开，画面定格；可叠一行字「让每一个想做点事的人，都能找到对的人」',
          '最后一句。\n\n非遗的传承不缺观众，缺的是愿意一起做的人。\n\n一个会插画的学生、一个会烧窑的师傅、一个会写文案的人，在别的平台上很难相遇，在这里可以被一个项目连起来。\n\n让每一个想做点事的人，都能找到对的人。谢谢各位评委老师。',
        ],
      ];
      const TOTAL_TARGET = 434;
      const listEl = document.getElementById('list');
      const textEl = document.getElementById('text');
      const segTitle = document.getElementById('seg-title');
      const segMeta = document.getElementById('seg-meta');
      const cueEl = document.getElementById('cue');
      const segClock = document.getElementById('segClock');
      const totalClock = document.getElementById('totalClock');
      const segTimeBox = document.querySelector('.seg-time');
      const playBtn = document.getElementById('play');
      const bar = document.querySelector('#progress > i');
      let idx = 0,
        elapsed = 0,
        total = 0,
        playing = false,
        timer = null,
        fontSize = 34;
      const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
      function hl(src) {
        return src
          .replace(/(\d+(?:\.\d+)?%?)/g, '<span class="num">$1</span>')
          .replace(/（[^）]*）/g, (m) => '<em>' + m + '</em>');
      }
      function renderList() {
        listEl.innerHTML = SEGMENTS.map(
          (s, i) =>
            '<a data-i="' +
            i +
            '" class="' +
            (i === idx ? 'active' : '') +
            (i < idx ? ' done' : '') +
            '"><span class="t">' +
            s[1] +
            's</span>' +
            s[0] +
            '</a>'
        ).join('');
      }
      function render() {
        const s = SEGMENTS[idx];
        segTitle.textContent = s[0];
        segMeta.textContent = '目标 ' + s[1] + ' 秒';
        cueEl.textContent = s[2];
        textEl.innerHTML = hl(s[3]);
        textEl.scrollTop = 0;
        renderList();
        paint();
      }
      function paint() {
        segClock.textContent = fmt(elapsed);
        totalClock.textContent = fmt(total);
        segTimeBox.classList.toggle('over', elapsed > SEGMENTS[idx][1] + 3);
        bar.style.width = Math.min(100, (total / TOTAL_TARGET) * 100) + '%';
      }
      function tick() {
        elapsed += 1;
        total += 1;
        paint();
      }
      function start() {
        if (playing) return;
        playing = true;
        playBtn.textContent = '暂停（空格）';
        timer = setInterval(tick, 1000);
      }
      function pause() {
        playing = false;
        playBtn.textContent = '继续（空格）';
        clearInterval(timer);
        timer = null;
      }
      function toggle() {
        playing ? pause() : start();
      }
      function goto(i, keepTotal) {
        if (i < 0 || i >= SEGMENTS.length) return;
        idx = i;
        elapsed = 0;
        if (!keepTotal) total = SEGMENTS.slice(0, idx).reduce((a, s) => a + s[1], 0);
        render();
      }
      document.getElementById('play').onclick = toggle;
      document.getElementById('next').onclick = () => goto(idx + 1);
      document.getElementById('prev').onclick = () => goto(idx - 1);
      document.getElementById('reset').onclick = () => {
        pause();
        total = 0;
        goto(0);
        render();
      };
      listEl.onclick = (e) => {
        const a = e.target.closest('a[data-i]');
        if (a) goto(Number(a.dataset.i));
      };
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          toggle();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          goto(idx + 1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          goto(idx - 1);
        } else if (e.key.toLowerCase() === 'r') {
          document.getElementById('reset').click();
        } else if (e.key === '+' || e.key === '=') {
          fontSize = Math.min(56, fontSize + 2);
          textEl.style.fontSize = fontSize + 'px';
        } else if (e.key === '-') {
          fontSize = Math.max(20, fontSize - 2);
          textEl.style.fontSize = fontSize + 'px';
        }
      });
      textEl.style.fontSize = fontSize + 'px';
      render();
    </script>
  </body>
</html>
