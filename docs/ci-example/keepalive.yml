# GitHub Actions：在线演示保活（部署后填一个 URL 即生效）
#
# 为什么需要：Render / Railway 的免费实例 15 分钟无访问会休眠，
# 评审点开链接要等 30-60 秒白屏 —— 这会让"在线演示"这一项从加分变扣分。
# 这个 workflow 每 10 分钟访问一次 /health，把实例保持唤醒（免费额度内）。
#
# 使用：
#   1. 仓库 Settings → Secrets and variables → Actions → New repository variable
#      Name: DEMO_URL      Value: https://xxx.onrender.com
#   2. 之后每次定时任务都会 ping 一次；也可以在 Actions 页面手动触发（Run workflow）
name: keep-demo-alive

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分钟
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping demo /health
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "::notice::未配置 DEMO_URL（仓库 Variables），跳过。部署完成后填上即可自动保活。"
            exit 0
          fi
          echo "ping $DEMO_URL/health"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 60 "$DEMO_URL/health" || true)
            echo "attempt $i -> HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              echo "::notice::服务在线 ✅"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::保活探测未成功（免费实例可能正在冷启动，属正常；连续失败请检查部署）"
