# render.yaml —— Render Blueprint（一键部署到免费实例）
# 用法：Render 控制台 → New → Blueprint → 选这个仓库
services:
  - type: web
    name: henan-ich-co-creation
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_OPEN_BROWSER
        value: "0"
      - key: AUTO_SETUP
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      # 部署时在 Render 面板里手动填（不要写进仓库）
      - key: JWT_SECRET
        sync: false
      - key: QWEN_API_KEY
        sync: false
