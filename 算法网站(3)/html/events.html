<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动资讯 - 河南省非物质文化遗产共创平台</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/style.css?v=v4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="page-hero">
        <div class="container">
            <h1><i class="fas fa-calendar-days"></i> 活动资讯</h1>
            <p>非遗节会、展览、培训与大赛的最新动态，以及河南非遗保护的权威资讯。</p>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="../index.html"><i class="fas fa-home"></i> 首页</a>
            <i class="fas fa-chevron-right"></i>
            <span class="current">活动资讯</span>
        </div>

        <div class="tab-container" style="background:#fffdf8;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:3rem;">
            <div class="tab-nav" style="display:flex;background:var(--paper-2);border-bottom:2px solid var(--primary);">
                <button class="tab-btn active" data-tab="events-panel" style="padding:1rem 1.8rem;border:none;background:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;gap:8px;"><i class="fas fa-calendar-days"></i> 非遗活动</button>
                <button class="tab-btn" data-tab="news-panel" style="padding:1rem 1.8rem;border:none;background:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;gap:8px;"><i class="fas fa-newspaper"></i> 非遗资讯</button>
            </div>
            <div class="tab-panel active" id="events-panel" style="padding:1.5rem;">
                <div id="events-list"></div>
            </div>
            <div class="tab-panel" id="news-panel" style="padding:1.5rem;">
                <div id="news-list"></div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>
    <div id="message-toast" class="toast"><i class="fas fa-check-circle toast-icon"></i><span class="toast-text"></span></div>

    <script src="../js/data.js?v=v4"></script>
    <script src="../js/script.js?v=v4"></script>
    <script src="../js/api.js?v=v4"></script>
    <script src="../js/co-common.js?v=v4"></script>
    <script src="../js/events.js?v=v4"></script>
</body>
</html>
