<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 非遗问答 - 河南省非遗共创平台</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=v16">
    <style>
        body { min-height: 100vh; }

        /* ---------- 顶部窄导航 ---------- */
        .ai-navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(135deg, #241a12 0%, #3a2e22 60%, #2a1c14 100%);
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .25);
        }
        .ai-navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: .55rem 15px;
            min-height: 60px;
        }
        .ai-logo {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            font-family: var(--font-serif);
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #f5e8c8;
        }
        .ai-logo img {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(224, 200, 135, .55), 0 4px 10px rgba(0, 0, 0, .35);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
        }
        .ai-logo:hover img { transform: scale(1.06) rotate(-3deg); }
        .ai-logo .ai-logo-title {
            font-size: 1.06rem;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ai-logo .ai-logo-sub {
            display: block;
            font-family: var(--font-sans);
            font-size: .64rem;
            letter-spacing: 2px;
            color: var(--gold-light);
            font-weight: 400;
        }
        .ai-nav-actions { display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .ai-nav-actions a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .84rem;
            color: rgba(245, 232, 200, .88);
            padding: .4rem .7rem;
            border-radius: 8px;
            border: 1px solid rgba(224, 200, 135, .3);
            transition: var(--transition);
            white-space: nowrap;
        }
        .ai-nav-actions a:hover { background: rgba(224, 200, 135, .16); color: #fff; }

        /* ---------- 聊天容器 ---------- */
        .ai-chat-container {
            width: 100%;
            max-width: 920px;
            margin: 22px auto 28px;
            padding: 0 16px;
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 0;
        }
        .chat-box {
            width: 100%;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 14px 44px rgba(36, 26, 18, .13);
            border: 1px solid var(--border);
            height: clamp(520px, calc(100vh - 140px), 760px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #b5813f, #a3242c);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .chat-header .chat-avatar {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .18);
            border: 1px solid rgba(255, 255, 255, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }
        .chat-header .chat-titles { min-width: 0; flex: 1; }
        .chat-header h2 { margin: 0; font-size: 1.24rem; line-height: 1.3; }
        .chat-header p { margin: 3px 0 0; font-size: .82rem; opacity: .9; }
        .ai-status {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .74rem;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .16);
            border: 1px solid rgba(255, 255, 255, .32);
            white-space: nowrap;
        }
        .ai-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #7ee2a8;
            box-shadow: 0 0 0 3px rgba(126, 226, 168, .25);
        }
        .ai-status.offline .dot { background: #ffd88a; box-shadow: 0 0 0 3px rgba(255, 216, 138, .25); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fbf9f5;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #d9cdb8; border-radius: 4px; }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            animation: slideIn .3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { flex-direction: row-reverse; }
        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b5813f, #a3242c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
            font-size: .92rem;
        }
        .message.user .message-avatar { background: linear-gradient(135deg, #3f7c6b, #2f5f52); }
        .message-body { max-width: min(76%, 620px); min-width: 0; }
        .message-content {
            padding: 12px 15px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
        }
        .message.user .message-content {
            background: #e9f6ee;
            border-color: #cfe8d9;
        }
        .message-content p {
            margin: 0;
            line-height: 1.72;
            white-space: pre-line;
            word-break: break-word;
            font-size: .94rem;
            color: var(--ink-2);
        }
        .message-foot {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .message-time { font-size: .72rem; color: #a99a83; }
        .msg-badge {
            font-size: .68rem;
            color: var(--ink-3);
            background: var(--paper-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0 .5rem;
        }
        .msg-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: .78rem;
            color: var(--primary);
            font-weight: 600;
            border-bottom: 1px dashed rgba(163, 36, 44, .4);
        }
        .msg-link:hover { color: var(--primary-dark); border-bottom-style: solid; }

        .example-questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 20px 0;
            border-top: 1px solid #f1e9da;
            background: #fff;
        }
        .example-q {
            padding: 7px 14px;
            background: #fffdf8;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: .84rem;
            color: var(--ink-3);
            cursor: pointer;
            transition: var(--transition);
        }
        .example-q:hover { background: var(--gold-soft); color: var(--primary); border-color: var(--gold); }

        .chat-input-area {
            padding: 14px 20px 18px;
            background: #fff;
        }
        .chat-input-wrapper { display: flex; gap: 10px; align-items: center; }
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e6e0d5;
            border-radius: 24px;
            font-size: .95rem;
            outline: none;
            transition: var(--transition);
            background: #fffdf8;
            min-width: 0;
        }
        .chat-input:focus { border-color: var(--gold); background: #fff; }
        .send-btn {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #b5813f, #a3242c);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .send-btn:hover { transform: scale(1.08); }
        .send-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            max-width: 90px;
        }
        .typing-indicator.active { display: block; }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b5813f;
            margin-right: 4px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: .3; }
            30% { opacity: 1; }
        }

        @media (max-width: 640px) {
            .ai-logo .ai-logo-sub { display: none; }
            .ai-nav-actions .nav-text { display: none; }
            .ai-chat-container { margin: 12px auto 16px; padding: 0 10px; }
            .chat-box { height: calc(100vh - 110px); border-radius: 14px; }
            .message-body { max-width: 84%; }
            .chat-header { padding: 12px 14px; }
            .chat-messages { padding: 14px; }
            .example-questions { padding: 10px 14px 0; }
            .chat-input-area { padding: 12px 14px 14px; }
        }

        /* ---------- AI 思考状态 / 引用 / 标识 / 重试 ---------- */
        .thinking {
            display: flex; align-items: center; gap: 8px;
            font-size: .8rem; color: var(--muted);
            margin: 0 0 6px 2px;
        }
        .thinking[hidden] { display: none; }
        .thinking-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--gold);
            animation: thinkPulse 1.1s ease-in-out infinite;
        }
        @keyframes thinkPulse {
            0%, 100% { transform: scale(.8); opacity: .45; }
            50% { transform: scale(1.25); opacity: 1; }
        }
        .citations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .citations[hidden] { display: none; }
        .citations-label { font-size: .72rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
        .cite-chip {
            font-size: .72rem; padding: 2px 8px; border-radius: 999px;
            background: var(--paper-2); border: 1px solid var(--border);
            color: var(--ink-3); cursor: help;
        }
        .ai-notice {
            margin-top: 8px; padding-top: 6px;
            border-top: 1px dashed var(--border);
            font-size: .72rem; color: var(--muted); line-height: 1.6;
        }
        .ai-notice[hidden] { display: none; }
        .msg-copy {
            border: none; background: none; color: var(--muted);
            cursor: pointer; font-size: .78rem; padding: 2px 6px; border-radius: 6px;
            font-family: inherit;
        }
        .msg-copy:hover { background: var(--paper-2); color: var(--primary); }
        .msg-copy[hidden] { display: none; }
        .retry-btn {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: .76rem; padding: 3px 10px; border-radius: 999px;
            border: 1px solid var(--primary); background: #fff; color: var(--primary);
            cursor: pointer; font-family: inherit;
        }
        .retry-btn:hover { background: var(--primary); color: #fff; }
        .message-content.is-error { border-color: rgba(176,36,90,.4); background: rgba(176,36,90,.04); }
        .mic-btn {
            width: 42px; height: 42px; flex: 0 0 auto;
            border-radius: 50%; border: 1px solid var(--border);
            background: #fffdf8; color: var(--ink-3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
        }
        .mic-btn:hover { border-color: var(--gold); color: var(--primary); }
        .mic-btn.recording { background: var(--primary); color: #fff; border-color: var(--primary); }
        @media (prefers-reduced-motion: reduce) {
            .thinking-dot { animation-duration: 3s; }
        }
    </style>
</head>
<body>
    <div class="ai-navbar">
        <div class="container">
            <a href="../index.html" class="ai-logo" aria-label="返回河南省非遗共创平台首页">
                <img src="../img/logo-ich.png" alt="河南省非遗共创平台 Logo" width="40" height="40" decoding="async">
                <span class="ai-logo-title">河南省非遗共创平台
                    <span class="ai-logo-sub">HENAN ICH CO-CREATION</span>
                </span>
            </a>
            <div class="ai-nav-actions">
                <a href="projects.html"><i class="fas fa-book-open"></i> <span class="nav-text">非遗项目库</span></a>
                <a href="../index.html"><i class="fas fa-house"></i> <span class="nav-text">返回首页</span></a>
            </div>
        </div>
    </div>

    <div class="ai-chat-container">
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar"><i class="fas fa-robot"></i></div>
                <div class="chat-titles">
                    <h2>AI 非遗助手</h2>
                    <p>我可以回答关于河南非物质文化遗产的问题</p>
                </div>
                <span class="ai-status" id="aiStatus"><span class="dot"></span><span id="aiStatusText">正在连接…</span></span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message">
                    <div class="message-avatar"><i class="fas fa-robot"></i></div>
                    <div class="message-body">
                        <div class="message-content">
                            <p>您好！我是河南省非遗共创平台的 AI 助手。您可以问我关于河南非物质文化遗产的问题，例如：</p>
                            <ul style="margin: 10px 0 0; padding-left: 20px; font-size: .92rem; color: var(--ink-2); line-height: 1.8;">
                                <li>河南有哪些著名的戏曲？</li>
                                <li>豫剧和曲剧有什么区别？</li>
                                <li>什么是钧瓷的窑变？</li>
                            </ul>
                        </div>
                        <div class="message-foot">
                            <span class="message-time" data-time></span>
                            <span class="msg-badge">开场引导</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="example-questions">
                <div class="example-q" onclick="askQuestion('河南有哪些著名的戏曲？')">河南有哪些著名的戏曲？</div>
                <div class="example-q" onclick="askQuestion('什么是钧瓷的窑变？')">什么是钧瓷的窑变？</div>
                <div class="example-q" onclick="askQuestion('少林功夫有哪些特点？')">少林功夫有哪些特点？</div>
                <div class="example-q" onclick="askQuestion('推荐一个适合做文创的河南非遗')">推荐一个适合做文创的非遗</div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <button class="mic-btn" id="micBtn" type="button" title="语音输入" aria-label="语音输入"><i class="fas fa-microphone"></i></button>
                    <input type="text" class="chat-input" id="chatInput" placeholder="输入您的问题..." autocomplete="off" onkeypress="handleKeyPress(event)">
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="发送">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js?v=v16"></script>
    <script src="../js/api.js?v=v16"></script>
    <script src="../js/ai-chat-kb.js?v=v16"></script>
    <script src="../js/ai-client.js?v=v16"></script>
    <script src="../js/ai-chat.js?v=v16"></script>
</body>
</html>
