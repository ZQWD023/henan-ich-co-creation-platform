<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共创项目详情 - 河南省非物质文化遗产共创平台</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/style.css?v=v16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="co-hero" id="hero">
        <div class="container">
            <div style="color:rgba(255,255,255,.75);font-size:.85rem;margin-bottom:.6rem;">
                <a href="co-projects.html" style="color:rgba(255,255,255,.9);text-decoration:none;"><i class="fas fa-arrow-left"></i> 返回共创项目</a>
            </div>
            <h1 id="hero-title">加载中…</h1>
            <div id="hero-meta" style="display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.88rem;color:rgba(255,255,255,.9);"></div>
        </div>
    </div>

    <div class="container" style="margin-top:-1.4rem;position:relative;z-index:2;">
        <div class="breadcrumb" style="background:#fff;border-radius:var(--radius-sm);padding:.6rem 1rem;display:inline-flex;">
            <a href="../index.html"><i class="fas fa-home"></i> 首页</a>
            <i class="fas fa-chevron-right"></i>
            <a href="co-projects.html">共创项目</a>
            <i class="fas fa-chevron-right"></i>
            <span class="current" id="crumb-name">详情</span>
        </div>

        <div class="co-layout" style="margin-top:1.2rem;margin-bottom:3rem;">
            <!-- 左侧主体 -->
            <div>
                <div class="co-tabs" id="tabs">
                    <button class="co-tab active" data-tab="brief"><i class="fas fa-circle-info"></i> 项目说明</button>
                    <button class="co-tab" data-tab="members"><i class="fas fa-user-group"></i> 成员 <span id="tab-members-count"></span></button>
                    <button class="co-tab" data-tab="tasks"><i class="fas fa-list-check"></i> 任务看板 <span id="tab-tasks-count"></span></button>
                    <button class="co-tab" data-tab="versions"><i class="fas fa-code-branch"></i> 成果版本 <span id="tab-versions-count"></span></button>
                    <button class="co-tab" data-tab="discussions"><i class="fas fa-comments"></i> 讨论 <span id="tab-disc-count"></span></button>
                </div>

                <div class="co-panel active" id="panel-brief"></div>
                <div class="co-panel" id="panel-members"></div>
                <div class="co-panel" id="panel-tasks"></div>
                <div class="co-panel" id="panel-versions"></div>
                <div class="co-panel" id="panel-discussions"></div>
            </div>

            <!-- 右侧栏 -->
            <aside class="co-side" id="side">
                <div style="text-align:center;padding:1rem 0;color:var(--muted);">加载中…</div>
            </aside>
        </div>
    </div>

    <!-- 申请加入 -->
    <div class="modal" id="apply-modal">
        <div class="modal-content" style="max-width:520px;">
            <div class="modal-header">
                <h3><i class="fas fa-hand"></i> 申请加入项目</h3>
                <button class="modal-close" id="apply-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="apply-form">
                    <div class="form-group">
                        <label for="a-role">希望承担的分工</label>
                        <select id="a-role" class="form-control">
                            <option value="设计">设计</option>
                            <option value="文案">文案</option>
                            <option value="制作">制作</option>
                            <option value="摄影">摄影</option>
                            <option value="统筹">统筹</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="a-reason">申请理由</label>
                        <textarea id="a-reason" class="form-control" rows="3" maxlength="300"
                            placeholder="简单介绍你的相关经验，方便发起人判断（选填）"></textarea>
                    </div>
                    <div class="form-actions" style="display:flex;gap:10px;">
                        <button type="submit" class="btn" id="a-submit">提交申请</button>
                        <button type="button" class="btn btn-outline" id="apply-cancel">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 提交成果版本 -->
    <div class="modal" id="version-modal">
        <div class="modal-content" style="max-width:560px;">
            <div class="modal-header">
                <h3><i class="fas fa-code-branch"></i> 提交成果版本</h3>
                <button class="modal-close" id="version-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="version-form">
                    <div class="form-group">
                        <label for="v-title">成果标题 <span style="color:var(--danger)">*</span></label>
                        <input type="text" id="v-title" class="form-control" maxlength="80" placeholder="例如：钧瓷茶器 器型方案 v2" required>
                    </div>
                    <div class="form-group">
                        <label for="v-content">成果说明</label>
                        <textarea id="v-content" class="form-control" rows="4" maxlength="5000" placeholder="这一版改了什么、下一步计划"></textarea>
                    </div>
                    <div class="form-actions" style="display:flex;gap:10px;">
                        <button type="submit" class="btn" id="v-submit">提交</button>
                        <button type="button" class="btn btn-outline" id="version-cancel">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>
    <div id="message-toast" class="toast"><i class="fas fa-check-circle toast-icon"></i><span class="toast-text"></span></div>

    <style>
        .co-prose{font-size:.95rem;line-height:1.85;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;}
        .co-section-block{margin-bottom:1.8rem;}
        .co-section-block h3{font-family:var(--font-serif);font-size:1.05rem;color:var(--ink);margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;}
        .co-section-block h3 i{color:var(--gold);}
        .co-member-row{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-bottom:1px dashed var(--border);}
        .co-member-row:last-child{border-bottom:none;}
        .co-member-info{flex:1;min-width:0;}
        .co-member-name{font-weight:600;font-size:.9rem;color:var(--ink);}
        .co-member-sub{font-size:.78rem;color:var(--muted);margin-top:.15rem;}
        .co-actions{display:flex;flex-direction:column;gap:.55rem;}
        .co-flow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:.8rem;}
        .co-flow span.done{color:var(--gold);font-weight:700;}
        .co-compose{margin-top:1rem;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;}
        .co-compose textarea{width:100%;padding:.65rem .8rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:.9rem;resize:vertical;min-height:76px;}
        .co-compose textarea:focus{outline:none;border-color:var(--primary);}
        .co-task-meta{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted);margin-top:.5rem;flex-wrap:wrap;}
    </style>

    <script src="../js/data.js?v=v16"></script>
    <script src="../js/script.js?v=v16"></script>
    <script src="../js/api.js?v=v16"></script>
    <script src="../js/offline-store.js?v=v16"></script>
    <script src="../js/co-common.js?v=v16"></script>
    <script src="../js/co-project-detail.js?v=v16"></script>
</body>
</html>
