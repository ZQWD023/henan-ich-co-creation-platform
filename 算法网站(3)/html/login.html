<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 河南省非物质文化遗产共创平台</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/style.css?v=v4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="container">
        <div class="form-container">
            <h2><i class="fas fa-sign-in-alt"></i> 用户登录</h2>
            <div id="login-message" class="message" style="display:none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-username"><i class="fas fa-user"></i> 用户名</label>
                    <input type="text" id="login-username" class="form-control" placeholder="请输入用户名" required>
                    <div id="usernameTip" style="font-size:12px;color:var(--danger);"></div>
                </div>
                <div class="form-group">
                    <label for="login-password"><i class="fas fa-lock"></i> 密码</label>
                    <input type="password" id="login-password" class="form-control" placeholder="请输入密码" required>
                    <div id="passwordTip" style="font-size:12px;color:var(--danger);"></div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-block">登 录</button>
                </div>
            </form>
            <div class="form-footer">
                <p>还没有账号？ <a href="register.html">立即注册</a></p>
                <p><a href="../index.html">返回首页</a></p>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="../js/data.js?v=v4"></script>
    <script src="../js/script.js?v=v4"></script>
    <script src="../js/api.js?v=v4"></script>
    <script src="../js/auth.js?v=v4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderSiteHeader('');
            renderSiteFooter();
        });
    </script>
</body>
</html>
