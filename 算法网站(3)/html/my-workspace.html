<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工作台 - 河南省非物质文化遗产共创平台</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/style.css?v=v4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="page-hero">
        <div class="container">
            <h1><i class="fas fa-table-columns"></i> 我的工作台</h1>
            <p>我发起的、我参与的、等我审核的、等我动手的 —— 一屏看完。</p>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="../index.html"><i class="fas fa-home"></i> 首页</a>
            <i class="fas fa-chevron-right"></i>
            <span class="current">我的工作台</span>
        </div>

        <div id="ws-root" style="margin-bottom:3rem;">
            <div class="co-skeleton" style="height:120px;margin-bottom:1rem;"></div>
            <div class="co-skeleton" style="height:200px;"></div>
        </div>
    </div>

    <div id="site-footer"></div>
    <div id="message-toast" class="toast"><i class="fas fa-check-circle toast-icon"></i><span class="toast-text"></span></div>

    <style>
        .ws-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;}
        .ws-stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;position:relative;overflow:hidden;transition:var(--transition);text-decoration:none;color:inherit;display:block;}
        .ws-stat:hover{border-color:var(--gold-light);box-shadow:var(--shadow);transform:translateY(-2px);}
        .ws-stat::after{content:'';position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--paper-2);opacity:.7;}
        .ws-stat-num{font-family:var(--font-serif);font-size:2rem;font-weight:700;color:var(--primary);line-height:1.1;position:relative;}
        .ws-stat-label{font-size:.82rem;color:var(--muted);margin-top:.3rem;position:relative;}
        .ws-block{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem 1.4rem;margin-bottom:1.4rem;}
        .ws-block-title{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-family:var(--font-serif);font-size:1.05rem;color:var(--ink);margin-bottom:1rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);}
        .ws-block-title i{color:var(--gold);margin-right:.4rem;}
        .ws-block-title .ws-count{font-family:var(--font-sans);font-size:.8rem;color:var(--muted);font-weight:400;}
        .ws-item{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;border-bottom:1px dashed var(--border);}
        .ws-item:last-child{border-bottom:none;padding-bottom:0;}
        .ws-item-main{flex:1;min-width:0;}
        .ws-item-title{font-weight:600;font-size:.92rem;color:var(--ink);margin-bottom:.25rem;line-height:1.4;}
        .ws-item-title a{color:inherit;text-decoration:none;}
        .ws-item-title a:hover{color:var(--primary);}
        .ws-item-sub{font-size:.79rem;color:var(--muted);display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;}
        .ws-progress-mini{width:110px;flex:0 0 auto;}
    </style>

    <script src="../js/data.js?v=v4"></script>
    <script src="../js/script.js?v=v4"></script>
    <script src="../js/api.js?v=v4"></script>
    <script src="../js/co-common.js?v=v4"></script>
    <script src="../js/my-workspace.js?v=v4"></script>
</body>
</html>
